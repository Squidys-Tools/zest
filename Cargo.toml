[workspace]
members = [
  "crates/zest-core",
  "crates/zest-selection",
  "crates/zest-convert",
  "crates/zest-shell",
  "crates/zest-overlay",
  "crates/zest-settings",
  "crates/zest-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Zest Contributors"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
csv = "1.3"
quick-xml = { version = "0.37", features = ["serialize"] }
tokio = { version = "1.47", features = ["rt", "rt-multi-thread", "macros", "process", "fs", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
semver = "1.0"
image = "0.25"
resvg = "0.44"
zip = "2.2"
tar = "0.4"
flate2 = "1.0"
tray-icon = "0.20"
global-hotkey = "0.6"
eframe = "0.32"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Notifications",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Dxgi_Common",
] }

zest-core = { path = "crates/zest-core" }
zest-selection = { path = "crates/zest-selection" }
zest-convert = { path = "crates/zest-convert" }
zest-shell = { path = "crates/zest-shell" }
zest-overlay = { path = "crates/zest-overlay" }
zest-settings = { path = "crates/zest-settings" }
